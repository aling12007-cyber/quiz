.options{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;display:flex;align-items:center;gap:10px}
.opt::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--petal-a)}

.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.opt[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.talk b{font-family:var(--round);color:var(--accent);display:block;margin-bottom:2px}

label{font-size:14px;color:var(--muted)}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:80px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.summary-item{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.summary-item:first-of-type{border-top:0;padding-top:0}
.summary-item .q{font-size:14px;color:var(--muted)}
.summary-item .a{font-weight:500}
.summary-item .n{font-size:14.5px;white-space:pre-wrap}
.closing{font-family:var(--round);font-size:19px;line-height:1.65;margin:0;text-align:center;text-wrap:balance}
.note{font-size:12.5px;color:var(--muted);margin:0;text-align:center}
footer{display:flex;flex-direction:column;gap:8px}
footer .garden{display:block;margin:0 auto;width:min(320px,100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 view:{zh:"自我決定理論指出，長期的幸福感來自三種需要：自主（自己選擇）、能力（覺得自己做得到）和連結（與人有親密關係）。外在成就本身不一定帶來幸福，關鍵是那是不是你自己想要的。",en:"Self-determination theory says lasting well-being comes from three needs: autonomy (choosing for yourself), competence (feeling capable) and relatedness (close connection). Outward achievement doesn’t guarantee happiness; what matters is whether it’s what you actually want.",ja:"自己決定理論によると、長く続く幸福感は三つの欲求から生まれます。自律性（自分で選ぶこと）、有能感（自分にはできると感じること）、関係性（人と親しくつながること）です。外から見える成功が幸せを保証するわけではなく、それが本当に自分の望みかどうかが大切です。"},
 src:{zh:"自我決定理論（Deci & Ryan）",en:"Self-determination theory (Deci & Ryan)",ja:"自己決定理論（デシ＆ライアン）"},
 talk:{zh:"你心中「活得好」的樣子，是你自己想要的，還是別人告訴你的？",en:"Is your picture of “living well” something you want, or something you were told to want?",ja:"あなたの思う「よく生きる」は、自分の望み？それとも誰かに言われてきたもの？"}},
{theme:{zh:"伴侶的過去",en:"A partner’s past",ja:"相手の過去"},
 q:{zh:"伴侶的過去，例如前任，你想知道多少？",en:"How much do you want to know about your partner’s past, like their exes?",ja:"パートナーの過去（元恋人など）を、どこまで知りたい？"},
 opts:[
  {zh:"越少越好，過去就讓它過去",en:"As little as possible; the past is past",ja:"知らないほうがいい。過去は過去"},
  {zh:"想知道全部，才有安全感",en:"Everything — that’s how I feel safe",ja:"全部知りたい。そのほうが安心できる"},
  {zh:"知道重要的事就好，細節不需要",en:"The important things, not the details",ja:"大事なことだけで、細かいことはいらない"},
  {zh:"想知道，但知道了又會難過",en:"I want to know, but knowing makes me sad",ja:"知りたいけど、知ると悲しくなる"}],
 view:{zh:"研究發現，對伴侶過去的「回溯性嫉妒」很常見，尤其在越在乎的時候越明顯。它多半和現在的不安有關，而不是過去本身。了解對方從過去學到什麼，通常比知道細節更有幫助。",en:"“Retroactive jealousy” about a partner’s past is common, and often strongest when we care most. It usually reflects present insecurity more than the past itself. Knowing what someone learned from their past tends to help more than knowing the details.",ja:"相手の過去への「遡及的嫉妬」はよくあることで、相手を大切に思うほど強くなりがちです。多くの場合、それは過去そのものより今の不安と関係しています。細かい出来事より、相手が過去から何を学んだかを知るほうが助けになります。"},
 src:{zh:"嫉妒與關係研究",en:"Research on jealousy in relationships",ja:"恋愛における嫉妬の研究"},
 talk:{zh:"知道伴侶的過去，對你來說是安心還是不安？為什麼？",en:"Does knowing a partner’s past make you feel calmer or more uneasy? Why?",ja:"相手の過去を知ることは、あなたにとって安心？それとも不安？それはなぜ？"}},
{theme:{zh:"原諒",en:"Forgiveness",ja:"許すこと"},
 q:{zh:"原諒一個傷害過你的人，是為了誰？",en:"When you forgive someone who hurt you, who is it for?",ja:"自分を傷つけた人を許すのは、誰のため？"},
 opts:[
  {zh:"為了自己，放下才能前進",en:"For me — letting go lets me move on",ja:"自分のため。手放してこそ前に進める"},
  {zh:"為了關係，想繼續走下去",en:"For the relationship — I want to keep going",ja:"関係のため。これからも続けたいから"},
  {zh:"有些傷害不需要被原諒",en:"Some hurts don’t need to be forgiven",ja:"許さなくていい傷もある"},
  {zh:"原諒了，但不會忘記",en:"I forgive, but I don’t forget",ja:"許しても、忘れはしない"}],
 view:{zh:"原諒研究（例如 Everett Worthington）指出，原諒是放下怨恨，不等於和好，也不等於說那件事沒關係。你可以原諒一個人，同時保持距離、設下界線。",en:"Forgiveness research (such as Everett Worthington’s) describes forgiveness as releasing resentment. It isn’t the same as reconciling, and it doesn’t mean what happened was okay. You can forgive someone and still keep your distance and your boundaries.",ja:"許しの研究（エヴェレット・ワーシントンなど）では、許しとは恨みを手放すことであり、仲直りすることとも、起きたことを「いいよ」と認めることとも違うとされています。許しながら、距離や境界線を保つこともできます。"},
 src:{zh:"原諒研究（Worthington）",en:"Forgiveness research (Worthington)",ja:"許しの研究（ワーシントン）"},
 talk:{zh:"有沒有一件事，你原諒了別人，卻還沒原諒自己？",en:"Is there something you’ve forgiven someone else for, but not yet forgiven yourself?",ja:"誰かのことは許せたのに、自分のことはまだ許せていない出来事はある？"}},
{theme:{zh:"留下或離開",en:"Stay or go",ja:"とどまるか、離れるか"},
 q:{zh:"還愛著，但不快樂的關係，該留下嗎？",en:"Should you stay in a relationship where you still love them, but you’re not happy?",ja:"まだ好きだけど幸せではない関係に、とどまるべき？"},
 opts:[
  {zh:"愛還在，就值得努力",en:"If the love is still there, it’s worth working on",ja:"愛があるなら、努力する価値がある"},
  {zh:"不快樂就該離開，愛不是全部",en:"If I’m unhappy, I should leave; love isn’t everything",ja:"幸せでないなら離れるべき。愛がすべてではない"},
  {zh:"要先弄清楚不快樂的原因",en:"First I need to understand why I’m unhappy",ja:"まずは幸せでない理由を見きわめたい"},
  {zh:"看對方願不願意一起改變",en:"It depends on whether they’ll change with me",ja:"相手が一緒に変わろうとしてくれるか次第"}],
 view:{zh:"高特曼的研究發現，伴侶間約有三分之二的衝突是長期存在的個性差異。重點不是消除它們，而是能不能帶著善意一起面對。輕蔑和長期的冷漠，比吵架本身更值得警覺。",en:"Gottman’s research finds about two-thirds of couple conflicts are lasting differences in personality. The question isn’t whether they disappear, but whether you can face them with goodwill. Contempt and long-term coldness are bigger warning signs than arguing itself.",ja:"ゴットマンの研究によると、カップルの対立の約3分の2は、ずっと続く性格の違いによるものです。大切なのはそれを消すことではなく、思いやりを持って一緒に向き合えるかどうか。言い争いそのものより、軽蔑や長く続く冷たさのほうが注意すべきサインです。"},
 src:{zh:"高特曼伴侶研究（Gottman Institute）",en:"Couples research (Gottman Institute)",ja:"ゴットマンの夫婦研究"},
 talk:{zh:"對你來說，「該離開」的界線在哪裡？",en:"Where is your line for “it’s time to leave”?",ja:"あなたにとって「離れるべき」と思う境界線はどこ？"}},
{theme:{zh:"好女孩的期待",en:"The “good girl” script",ja:"「いい子」という期待"},
 q:{zh:"「要乖、要體貼、不要讓人失望」——這些期待，讓你得到了什麼，又失去了什麼？",en:"“Be nice, be considerate, don’t disappoint anyone.” What have these expectations given you, and what have they cost you?",ja:"「いい子でいて、気を配って、人をがっかりさせないで」——この期待は、あなたに何を与え、何を奪った？"},
 opts:[
  {zh:"讓我很會照顧別人，卻常忽略自己",en:"I’m good at caring for others, but often forget myself",ja:"人の世話は得意になったけど、自分を後回しにしがち"},
  {zh:"讓我很難說「不」",en:"It makes it hard to say no",ja:"「ノー」と言うのが難しくなった"},
  {zh:"讓我學會體貼，這是好的",en:"It taught me kindness, and that’s good",ja:"思いやりを学べた。それは良いこと"},
  {zh:"我已經慢慢放下這些期待了",en:"I’ve been slowly letting them go",ja:"少しずつ手放してきた"}],
 view:{zh:"研究發現，討好他人的傾向和較高的倦怠感、較低的自我價值有關，而女性常從小被期待扮演照顧者。體貼本身是美德，但當它變成「不能拒絕」時，就值得重新思考。",en:"Research links people-pleasing with more burnout and lower self-worth, and many women are raised to be caretakers. Kindness is a virtue, but when it turns into “I can’t say no,” it’s worth rethinking.",ja:"研究では、人に合わせすぎる傾向は燃え尽きや自己価値の低さと関係するとされています。そして多くの女性は、小さいころから世話をする役割を期待されてきました。思いやりは美徳ですが、それが「断れない」になったときは、見直してみる価値があります。"},
 src:{zh:"性別社會化與討好行為研究",en:"Research on gender socialization and people-pleasing",ja:"ジェンダーの社会化と迎合行動の研究"},
 talk:{zh:"如果小時候的你，可以不用當「好女孩」，你想對她說什麼？",en:"If the younger you didn’t have to be a “good girl,” what would you tell her?",ja:"「いい子」でいなくてよかったとしたら、子どものころの自分に何と言ってあげたい？"}}
];
const KEY="blooming-questions-v1",LKEY="blooming-questions-lang";
const blank=()=>({i:0,ans:Array(QS.length).fill(null),notes:Array(QS.length).fill("")});
let state=blank();
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.ans)&&s.ans.length===QS.length)state=s}catch(e){}
let lang=(()=>{try{const l=localStorage.getItem(LKEY);if(l&&UI[l])return l}catch(e){}
  const n=(navigator.language||"").toLowerCase();return n.startsWith("ja")?"ja":n.startsWith("zh")?"zh":"en"})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=o=>o[lang];
const petals=["--petal-a","--petal-c","--petal-b"];
function setLang(l){lang=l;try{localStorage.setItem(LKEY,l)}catch(e){}
  document.documentElement.lang={zh:"zh-Hant",en:"en",ja:"ja"}[l];
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  const u=UI[l];$("t-eyebrow").textContent=u.eyebrow;$("t-title").textContent=u.title;$("t-lead").textContent=u.lead;$("t-privacy").textContent=u.privacy;
  document.title=u.title;render()}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function progress(){
  const done=state.i>=QS.length;
  $("progress").innerHTML=QS.map((_,k)=>{const on=done||k<=state.i;
    return `<svg viewBox="0 0 24 24"><use href="#flower" width="24" height="24" style="color:var(${on?petals[k%3]:'--line'})"/></svg>`}).join("");
}
function render(){
  progress();const u=UI[lang];
  if(state.i>=QS.length)return renderSummary();
  const Q=QS[state.i],a=state.ans[state.i];
  $("stage").innerHTML=`
    <svg class="corner" viewBox="0 0 50 50" aria-hidden="true"><use href="#flower" width="50" height="50" style="color:var(${petals[state.i%3]})"/></svg>
    <div class="qnum">${u.qnum(state.i+1,QS.length)}</div>
    <span class="theme">${T(Q.theme)}</span>
    <h2>${T(Q.q)}</h2>
    <div class="options" role="group">
      ${Q.opts.map((o,k)=>`<button type="button" class="opt" id="opt-${state.i}-${k}" aria-pressed="${a===k}" data-k="${k}">${T(o)}</button>`).join("")}
    </div>
    ${a!==null?`<div class="insight"><p>${T(Q.view)}</p><p class="src">${u.src}${T(Q.src)}</p></div>
    <div class="talk"><b>${u.talk}</b>${T(Q.talk)}</div>
    <label for="note-${state.i}">${u.more}</label>
    <textarea id="note-${state.i}" placeholder="${esc(u.ph)}">${esc(state.notes[state.i])}</textarea>`:''}
    <div class="nav">
      <button type="button" class="btn" id="prev" ${state.i===0?'disabled':''}>${u.prev}</button>
      <button type="button" class="btn primary" id="next" ${a===null?'disabled':''}>${state.i===QS.length-1?u.done:u.next}</button>
    </div>`;
  $("stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{state.ans[state.i]=+b.dataset.k;save();render();$("opt-"+state.i+"-"+b.dataset.k).focus()});
  const ta=$("note-"+state.i);if(ta)ta.oninput=()=>{state.notes[state.i]=ta.value;save()};
  $("prev").onclick=()=>{state.i--;save();render()};
  $("next").onclick=()=>{state.i++;save();render();window.scrollTo({top:0})};
}
function renderSummary(){
  const u=UI[lang];
  $("stage").innerHTML=`
    <svg class="corner" viewBox="0 0 50 50" aria-hidden="true"><use href="#flower" width="50" height="50" style="color:var(--petal-a)"/></svg>
    <div class="qnum">${u.yours}</div>
    ${QS.map((Q,k)=>`<div class="summary-item"><div class="q">${k+1}. ${T(Q.q)}</div>
      <div class="a">${state.ans[k]!==null?T(Q.opts[state.ans[k]]):u.none}</div>
      ${state.notes[k]?`<div class="n">${esc(state.notes[k])}</div>`:''}</div>`).join("")}
    <p class="closing">${u.closing}</p>
    <div class="nav">
      <button type="button" class="btn" id="copy">${u.copy}</button>
      <button type="button" class="btn primary" id="again">${u.again}</button>
    </div>`;
  $("copy").onclick=async()=>{
    const txt=u.title+"\n\n"+QS.map((Q,k)=>`${k+1}. ${T(Q.q)}\n→ ${state.ans[k]!==null?T(Q.opts[state.ans[k]]):u.none}${state.notes[k]?'\n  '+state.notes[k]:''}`).join("\n\n")+"\n\n"+location.href;
    try{await navigator.clipboard.writeText(txt);$("copy").textContent=u.copied}catch(e){$("copy").textContent=u.copyFail}
  };
  $("again").onclick=()=>{state=blank();save();render();window.scrollTo({top:0})};
}
setLang(lang);
</script>
